# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-bsp/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-bsp/*/*.bbappend"
BBFILES += "${LAYERDIR}/recipes-kernel/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-kernel/*/*.bbappend"
BBFILES += "${LAYERDIR}/recipes-simpleboot/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-simpleboot/*/*.bbappend"

BBFILE_COLLECTIONS += "simpleboot"
BBFILE_PATTERN_simpleboot = "^${LAYERDIR}/"
BBFILE_PRIORITY_simpleboot = "6"

LAYERDEPENDS_simpleboot = "core"
LAYERSERIES_COMPAT_simpleboot = "whinlatter"

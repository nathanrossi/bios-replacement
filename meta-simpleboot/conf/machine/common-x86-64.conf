#@TYPE: Machine
#@NAME: Common x86_64 (e.g. Intel J6412, Intel N100, QEMU, etc.)

DEFAULTTUNE ?= "x86-64-v2"
require conf/machine/include/x86/tune-x86-64-v2.inc

MACHINE_FEATURES += " \
    screen keyboard pci usbhost ext2 ext3 x86 \
    acpi serial usbgadget alsa efi \
    "

SERIAL_CONSOLES ?= "115200;ttyS0"
SERIAL_CONSOLES_CHECK = "ttyS0"

KERNEL_IMAGETYPE ?= "bzImage"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules linux-firmware"

# No EFI provider, direct kernel boot
EFI_PROVIDER = ""
